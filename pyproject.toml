[project]
name = "sims-next"
version = "0.1.0"
description = "Student Information Management System - FastAPI based student info management system with support for students, teachers, classes, and scores"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic>=2.13.4",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.47.0",
]
